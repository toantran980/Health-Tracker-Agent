name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14 (latest)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (py_compile)
        run: |
          python -m compileall -q api ai_modules models config.py main.py

      - name: Run unit tests
        env:
          # CI has no MongoDB; force the fast-fail path so tests use in-memory fs.
          MONGO_CONNECT_RETRIES: "1"
          MONGO_URI: mongodb://127.0.0.1:1
          # Keyless chatbot fallback keeps tests hermetic and network-free.
          GROQ_API_KEY: ""
        run: |
          python -m unittest tests.test_ai_modules tests.test_api_blueprints -v
