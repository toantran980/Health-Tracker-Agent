name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Migration
    runs-on: ubuntu-latest

    env:
      MONGO_CONNECT_RETRIES: "1"
      MONGO_URI: mongodb://127.0.0.1:1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.dev.txt
          pip install ruff pip-audit

      - name: Code quality & linting (Ruff)
        run: |
          ruff check .

      - name: Security & dependency audit
        run: |
          pip-audit -r requirements.txt -r requirements.dev.txt --desc on --progress-spinner off

      - name: Compile check (py_compile)
        run: |
          python -m compileall -q api ai_modules models config.py main.py scripts

      - name: Migration & schema readiness check
        env:
          APP_ENV: development
        run: |
          python scripts/migration_check.py

      - name: Run unit & integration test suite
        run: |
          pytest tests/ -v