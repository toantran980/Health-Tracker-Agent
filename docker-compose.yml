services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-tracker-app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 5001
      DEBUG: "False"
      DEVELOPER_MODE: "False"
      SHOW_API_OUTPUT: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment or .env file}
      SESSION_COOKIE_SECURE: "True"
      SESSION_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_HTTPONLY: "True"
      MONGO_URI: mongodb://health-tracker-mongo:27017/health_tracker
      MONGO_DB_NAME: health_tracker
      GUNICORN_WORKERS: "2"
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: health-tracker-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  mongo_data: